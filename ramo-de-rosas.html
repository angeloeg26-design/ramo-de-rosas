/* =========================================================
   ✏️  EDITA TU CONTENIDO EN EL BLOQUE "CONTENT" DEL <script>
   AL FINAL DE ESTE ARCHIVO. No necesitas tocar el CSS/HTML.

:root{
  --void:#0B0F2E;
  --void-2:#070A22;
  --silver:#E9E8FA;
  --lavender:#B9AEDB;
  --moon:#E8C77A;
  --rose-deep:#7A0F2D;
  --rose-mid:#C81E4B;
  --rose-light:#F4A6BC;
  --serif: 'Didot', 'Bodoni MT', 'Palatino Linotype', Georgia, serif;
  --script: 'Brush Script MT', 'Segoe Script', 'Bradley Hand', cursive;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at 30% 0%, #1B2266 0%, transparent 55%),
    radial-gradient(ellipse at 80% 100%, #241245 0%, transparent 50%),
    linear-gradient(180deg, var(--void) 0%, var(--void-2) 100%);
  min-height:100vh;
  font-family:var(--sans);
  color:var(--silver);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px 12px;
  overflow:hidden;
}

.frame{
  width:100%; max-width:440px; height:min(780px, 92vh);
  position:relative;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 30px 70px -25px rgba(0,0,0,.7), 0 0 0 1px rgba(233,232,255,.12);
}

.sky{position:absolute; inset:0; overflow:hidden; z-index:0;}
.star{position:absolute; background:var(--silver); border-radius:50%; opacity:.5; animation:twinkle 3.5s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.15;} 50%{opacity:.85;}}
.hill{
  position:absolute; left:0; right:0; bottom:0; height:22%;
  background:var(--void-2);
  clip-path: polygon(0% 40%, 12% 30%, 25% 45%, 38% 25%, 52% 40%, 68% 20%, 82% 38%, 100% 28%, 100% 100%, 0% 100%);
  z-index:1;
}

.mute-btn{
  position:absolute; top:14px; right:14px; z-index:7;
  width:34px; height:34px; border-radius:50%;
  background:rgba(255,255,255,.1); border:1px solid var(--glass-border, rgba(233,232,255,.18));
  color:var(--silver); font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.mute-btn.muted{ opacity:.5; }

.lyrics-btn{
  right:56px;
  font-family:var(--serif); font-size:13px; font-style:italic;
}

.lyrics-panel{
  position:absolute; inset:0; z-index:8;
  background:rgba(7,10,34,.94);
  backdrop-filter:blur(8px);
  display:none;
  flex-direction:column;
  padding:60px 22px 26px 22px;
}
.lyrics-panel.show{ display:flex; }
.lyrics-close{
  position:absolute; top:16px; right:16px;
  background:none; border:none; color:var(--lavender); font-size:18px; cursor:pointer;
}
.lyrics-scroll{
  flex:1; overflow-y:auto;
  display:flex; flex-direction:column; gap:16px;
  text-align:center;
}
.lyrics-line{
  font-family:var(--serif); font-size:15px; color:rgba(233,232,255,.4);
  transition: color .3s ease, transform .3s ease;
  line-height:1.5;
}
.lyrics-line .en{ display:block; }
.lyrics-line .es{ display:block; font-size:12px; font-style:italic; opacity:.8; margin-top:2px; }
.lyrics-line.active{
  color:var(--silver);
  transform:scale(1.06);
}
.lyrics-line.active .en{ color:var(--rose-light); }
.cover-screen{
  position:absolute; inset:0; z-index:6;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:transparent;
  transition: opacity .6s ease;
}
.cover-screen.fade-out{ opacity:0; pointer-events:none; }
.cover-heart{
  width:110px; height:110px; border-radius:50%;
  background:none; border:none; padding:0; cursor:pointer;
  filter: drop-shadow(0 0 22px rgba(200,30,75,.6)) drop-shadow(0 6px 14px rgba(0,0,0,.5));
  animation: pulseSlow 1.5s ease-in-out infinite;
}
.cover-heart svg{ width:100%; height:100%; overflow:visible; }
.cover-cta{
  margin-top:22px; font-family:var(--script); font-size:21px; color:var(--silver);
  text-shadow:0 2px 10px rgba(0,0,0,.6);
}

.lock-heart{
  position:relative; width:110px; height:110px;
  filter: drop-shadow(0 0 22px rgba(200,30,75,.45)) drop-shadow(0 6px 14px rgba(0,0,0,.5));
  opacity:.55;
}
.lock-heart svg{ width:100%; height:100%; overflow:visible; filter:grayscale(35%); }
.lock-icon{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:30px; text-shadow:0 2px 6px rgba(0,0,0,.6);
}
.countdown-view{ display:flex; flex-direction:column; align-items:center; }
.countdown-label{
  margin-top:20px; font-family:var(--script); font-size:19px; color:var(--silver); opacity:.9;
  text-align:center; padding:0 20px;
}
.countdown-grid{ display:flex; gap:16px; margin-top:20px; }
.cd-unit{
  display:flex; flex-direction:column; align-items:center;
  min-width:52px;
}
.cd-unit span{
  font-family:var(--serif); font-size:30px; color:var(--moon);
  font-variant-numeric:tabular-nums;
}
.cd-unit small{
  font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--lavender); margin-top:4px;
}

/* ---------- pantalla principal ---------- */
.press-stage{
  position:absolute; inset:0; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer;
  opacity:0;
  transition: opacity .7s ease;
}
.press-stage.visible{ opacity:1; }
.top-tag{
  position:absolute; top:22px; left:0; right:0; text-align:center;
  font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--moon);
  opacity:.85;
}

.rose-holder{
  position:relative; width:190px; height:190px;
  display:flex; align-items:center; justify-content:center;
}
.ring-svg{ position:absolute; inset:0; transform:rotate(-90deg); }
.ring-bg{ fill:none; stroke:rgba(233,232,255,.15); stroke-width:3; }
.ring-fill{ fill:none; stroke:var(--moon); stroke-width:3; stroke-linecap:round; }

.rose-btn{
  position:relative; z-index:3;
  width:118px; height:118px; border-radius:50%;
  background:none; border:none; padding:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  filter: drop-shadow(0 0 18px rgba(200,30,75,.55)) drop-shadow(0 6px 14px rgba(0,0,0,.5));
  animation: pulseSlow 1.7s ease-in-out infinite;
}
.rose-btn.holding{ animation: pulseFast .55s ease-in-out infinite; }
.rose-btn svg{ width:100%; height:100%; overflow:visible; }
@keyframes pulseSlow{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.055);} }
@keyframes pulseFast{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.13);} }

.hint{
  margin-top:26px; font-family:var(--script); font-size:19px; color:var(--silver); opacity:.9;
  text-align:center; padding:0 30px;
}
.hint.sub{ font-family:var(--sans); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--lavender); margin-top:8px; opacity:.75;}

/* ---------- frase flotante al tocar el fondo ---------- */
.floating-msg{
  position:absolute; left:8%; right:8%;
  font-family:var(--script); font-size:20px; text-align:center;
  color:var(--silver); text-shadow:0 2px 10px rgba(0,0,0,.6);
  opacity:0; pointer-events:none; z-index:4;
  transition: opacity .4s ease, transform .6s ease;
  transform: translateY(8px);
}
.floating-msg.show{ opacity:1; transform:translateY(0); }

/* ---------- overlay final ---------- */
.final-overlay{
  position:absolute; inset:0; z-index:10;
  display:flex; align-items:center; justify-content:center;
  background:rgba(7,10,34,.55);
  backdrop-filter:blur(6px);
  opacity:0; pointer-events:none;
  transition:opacity .4s ease;
}
.final-overlay.show{ opacity:1; pointer-events:auto; }
.final-card{
  position:relative;
  width:86%; max-width:340px;
  background:linear-gradient(160deg, rgba(30,20,60,.92), rgba(15,12,40,.95));
  border:1px solid rgba(233,232,255,.22);
  border-radius:18px;
  padding:32px 24px 26px 24px;
  text-align:center;
  box-shadow:0 25px 60px -20px rgba(0,0,0,.8);
  transform: scale(.85);
  transition: transform .45s cubic-bezier(.34,1.56,.64,1);
}
.final-overlay.show .final-card{ transform: scale(1); }
.final-close{
  position:absolute; top:12px; right:14px;
  background:none; border:none; color:var(--lavender); font-size:18px; cursor:pointer;
  opacity:.7;
}
.final-title{ font-family:var(--script); font-size:26px; color:var(--rose-light); margin:4px 0 16px 0; }
.final-image{
  display:block; width:150px; height:150px; object-fit:cover;
  border-radius:14px; margin:0 auto 16px auto;
  border:1px solid rgba(233,232,255,.25);
  box-shadow:0 10px 24px -10px rgba(0,0,0,.6);
}
.final-text{ font-family:var(--serif); font-size:15.5px; line-height:1.7; color:var(--silver); margin:0 0 18px 0; }
.final-sign{ font-family:var(--script); font-size:19px; color:var(--moon); }

.rain{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
.rain-item{
  position:absolute; top:-40px;
  animation: rainFall linear infinite;
}
@keyframes rainFall{
  0%{ transform:translateY(0) rotate(0deg); opacity:0; }
  8%{ opacity:1; }
  90%{ opacity:.85; }
  100%{ transform:translateY(720px) rotate(50deg); opacity:0; }
}

/* partículas del final */
.burst{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.spark{ position:absolute; font-size:14px; opacity:0; animation: sparkUp 2.6s ease-out forwards; }
@keyframes sparkUp{
  0%{ opacity:0; transform:translateY(0) scale(.6) rotate(0deg); }
  15%{ opacity:1; }
  100%{ opacity:0; transform:translateY(-160px) scale(1.1) rotate(30deg); }
}

// ---- estrellas fugaces (solo en la pantalla principal) ----
let mainScreenActive = false;

function spawnShootingStar(){
  const sky = document.getElementById('sky');
  const dx = 140 + Math.random() * 120;
  const dy = 70 + Math.random() * 70;
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;

  const el = document.createElement('div');
  el.style.position = 'absolute';
  el.style.width = (70 + Math.random()*40) + 'px';
  el.style.height = '2px';
  el.style.left = (Math.random() * 55) + '%';
  el.style.top = (Math.random() * 28) + '%';
  el.style.background = 'linear-gradient(90deg, transparent, rgba(255,255,255,.95))';
  el.style.borderRadius = '2px';
  el.style.filter = 'drop-shadow(0 0 4px rgba(255,255,255,.85))';
  el.style.transformOrigin = 'left center';
  el.style.pointerEvents = 'none';
  sky.appendChild(el);

  const duration = 480 + Math.random()*220;
  const anim = el.animate([
    { transform: 'translate(0,0) rotate(' + angle + 'deg)', opacity: 0 },
    { transform: 'translate(' + (dx*0.15) + 'px,' + (dy*0.15) + 'px) rotate(' + angle + 'deg)', opacity: 1, offset: 0.15 },
    { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + angle + 'deg)', opacity: 0 }
  ], { duration: duration, easing: 'linear' });
  anim.onfinish = () => el.remove();
}

function scheduleShootingStar(){
  if (!mainScreenActive) return;
  const wait = 3500 + Math.random() * 5000;
  setTimeout(() => {
    if (mainScreenActive){
      spawnShootingStar();
      if (Math.random() < 0.3){
        setTimeout(() => { if (mainScreenActive) spawnShootingStar(); }, 120 + Math.random()*180);
      }
      scheduleShootingStar();
    }
  }, wait);
}

// ---- letra sincronizada ----
const bgAudio = document.getElementById('bgAudio');
const muteBtn = document.getElementById('muteBtn');
let audioStarted = false;

const lyricsScroll = document.getElementById('lyricsScroll');
const lyricsPanel = document.getElementById('lyricsPanel');
const lyricsBtn = document.getElementById('lyricsBtn');
const lyricsCloseBtn = document.getElementById('lyricsCloseBtn');

function buildLyrics(){
  lyricsScroll.innerHTML = '';
  CONTENT.letra.forEach((linea, i) => {
    const div = document.createElement('div');
    div.className = 'lyrics-line';
    div.dataset.index = i;
    const en = document.createElement('span');
    en.className = 'en';
    en.textContent = linea.en;
    div.appendChild(en);
    if (linea.es){
      const es = document.createElement('span');
      es.className = 'es';
      es.textContent = '(' + linea.es + ')';
      div.appendChild(es);
    }
    lyricsScroll.appendChild(div);
  });
}
buildLyrics();

bgAudio.addEventListener('timeupdate', () => {
  if (!lyricsPanel.classList.contains('show')) return;
  const t = bgAudio.currentTime;
  let activeIndex = -1;
  for (let i = 0; i < CONTENT.letra.length; i++){
    if (t >= CONTENT.letra[i].t) activeIndex = i;
  }
  const lines = lyricsScroll.querySelectorAll('.lyrics-line');
  lines.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
  if (activeIndex >= 0){
    lines[activeIndex].scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
});

lyricsBtn.addEventListener('click', () => {
  if (!mainScreenActive) return;
  lyricsPanel.classList.add('show');
});
lyricsCloseBtn.addEventListener('click', () => lyricsPanel.classList.remove('show'));

// ---- portada: toca para iniciar ----

let unlockTimer = null;
function checkUnlock(){
  const target = new Date(CONTENT.fechaDesbloqueo).getTime();
  const now = Date.now();
  const diff = target - now;

  if (diff <= 0){
    if (unlockTimer) clearInterval(unlockTimer);
    document.getElementById('countdownView').style.display = 'none';
    document.getElementById('coverHeartBtn').style.display = 'block';
    document.getElementById('coverCta').style.display = 'block';
    return;
  }

  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  const secs = Math.floor((diff % 60000) / 1000);

  document.getElementById('cdDays').textContent = days;
  document.getElementById('cdHours').textContent = String(hours).padStart(2,'0');
  document.getElementById('cdMins').textContent = String(mins).padStart(2,'0');
  document.getElementById('cdSecs').textContent = String(secs).padStart(2,'0');
}

checkUnlock();
unlockTimer = setInterval(checkUnlock, 1000);

      bgAudio.play().catch(() => {});
    }catch(e){}
  }
});

// ---- frases breves al tocar el fondo ----
let fraseOrden = [];
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function nextFrase(){
  if (fraseOrden.length === 0) fraseOrden = shuffle(CONTENT.frasesBreves);
  return fraseOrden.pop();
}

let floatTimer = null;
function showFloatingMessage(){
  const el = document.getElementById('floatingMsg');
  const stage = document.getElementById('pressStage');
  const roseHolder = document.querySelector('.rose-holder');
  const hintSub = document.getElementById('hintSub');

  const stageRect = stage.getBoundingClientRect();
  const roseRect = roseHolder.getBoundingClientRect();
  const hintRect = hintSub.getBoundingClientRect();

  const edgeMargin = 46; // no pegado a los bordes de la pantalla
  const gap = 14; // separación respecto al corazón / instrucciones

  const topZoneStart = edgeMargin;
  const topZoneEnd = (roseRect.top - stageRect.top) - gap;
  const bottomZoneStart = (hintRect.bottom - stageRect.top) + gap;
  const bottomZoneEnd = stageRect.height - edgeMargin;

  const topZoneOk = (topZoneEnd - topZoneStart) > 20;
  const bottomZoneOk = (bottomZoneEnd - bottomZoneStart) > 20;

  let posPx;
  if (topZoneOk && (!bottomZoneOk || Math.random() < 0.5)){
    posPx = topZoneStart + Math.random() * (topZoneEnd - topZoneStart);
  } else if (bottomZoneOk){
    posPx = bottomZoneStart + Math.random() * (bottomZoneEnd - bottomZoneStart);
  } else {
    posPx = edgeMargin; // respaldo si la pantalla es muy chica
  }

  const texto = nextFrase();
  el.textContent = texto;
  el.style.top = posPx + 'px';
  el.classList.remove('show');
  void el.offsetWidth; // reinicia la transición
  el.classList.add('show');
  clearTimeout(floatTimer);
  floatTimer = setTimeout(() => el.classList.remove('show'), 2900);
}

// ---- mantener presionada la rosa ----
const HOLD_MS = 2200;
const CIRC = 2 * Math.PI * 86;
const roseBtn = document.getElementById('roseBtn');
const ringFill = document.getElementById('ringFill');
let holdStart = null;
let holdRAF = null;
let holdActive = false;

function tickHold(ts){
  if (!holdActive) return;
  if (holdStart === null) holdStart = ts;
  const elapsed = ts - holdStart;
  const pct = Math.min(1, elapsed / HOLD_MS);
  ringFill.setAttribute('stroke-dashoffset', CIRC * (1 - pct));
  if (pct >= 1){
    holdActive = false;
    openFinal();
    return;
  }
  holdRAF = requestAnimationFrame(tickHold);
}

function startHold(e){
  e.stopPropagation();
  holdActive = true;
  holdStart = null;
  roseBtn.classList.add('holding');
  holdRAF = requestAnimationFrame(tickHold);
}
function cancelHold(){
  if (!holdActive && ringFill.getAttribute('stroke-dashoffset') == CIRC) return;
  holdActive = false;
  cancelAnimationFrame(holdRAF);
  roseBtn.classList.remove('holding');
  ringFill.style.transition = 'stroke-dashoffset .4s ease';
  ringFill.setAttribute('stroke-dashoffset', CIRC);
  setTimeout(() => { ringFill.style.transition = 'none'; }, 420);
}

roseBtn.addEventListener('pointerdown', startHold);
roseBtn.addEventListener('pointerup', cancelHold);
roseBtn.addEventListener('pointerleave', cancelHold);
roseBtn.addEventListener('pointercancel', cancelHold);

// tocar el fondo (fuera de la rosa) muestra una frase
document.getElementById('pressStage').addEventListener('click', (e) => {
  if (roseBtn.contains(e.target)) return;
  showFloatingMessage();
});

// ---- overlay final ----
function openFinal(){
  roseBtn.classList.remove('holding');
  document.getElementById('finalOverlay').classList.add('show');
  launchBurst();
  launchRain();
}
function closeFinal(){
  document.getElementById('finalOverlay').classList.remove('show');
  ringFill.style.transition = 'stroke-dashoffset .4s ease';
  ringFill.setAttribute('stroke-dashoffset', CIRC);
  setTimeout(() => { ringFill.style.transition = 'none'; }, 420);
  document.getElementById('finalRain').innerHTML = ''; // detiene la lluvia
}
function launchRain(){
  const rain = document.getElementById('finalRain');
  rain.innerHTML = '';
  const glyphs = ['♥','✦','✧','❀'];
  const count = 28;
  for (let i = 0; i < count; i++){
    const item = document.createElement('div');
    item.className = 'rain-item';
    item.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    const size = 10 + Math.random() * 14;
    item.style.fontSize = size + 'px';
    item.style.left = Math.random() * 100 + '%';
    item.style.color = Math.random() > .5 ? 'var(--moon)' : 'var(--rose-light)';
    item.style.animationDuration = (6 + Math.random() * 7) + 's';
    item.style.animationDelay = (-Math.random() * 12) + 's';
    rain.appendChild(item);
  }
}

// Registra el service worker para que funcione sin internet después de la primera visita.
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
function launchBurst(){
  const burst = document.getElementById('burst');
  burst.innerHTML = '';
  const glyphs = ['✦','✧','♥','❀','✦'];
  for (let i = 0; i < 22; i++){
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    s.style.left = (10 + Math.random()*80) + '%';
    s.style.bottom = (10 + Math.random()*20) + '%';
    s.style.color = Math.random() > .5 ? 'var(--moon)' : 'var(--rose-light)';
    s.style.animationDelay = (Math.random()*.6) + 's';
    burst.appendChild(s);
  }
}
</script>
</body>
